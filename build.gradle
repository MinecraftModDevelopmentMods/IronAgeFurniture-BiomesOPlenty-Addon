plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}


// Start here for toolchains, dependencies and local Minecraft launch settings.
apply from: 'gradle/build-environment.gradle'

// Metadata, packaging and publication checks are kept together.
apply from: 'gradle/artifacts.gradle'
apply from: 'gradle/verification.gradle'
apply from: 'gradle/release-validation.gradle'

// Keep Eclipse using the same production output as the Gradle build.
apply from: 'gradle/eclipse.gradle'

// The catalogs generate furniture resources and share their rules with add-ons.
apply from: 'gradle/phase-four-catalog.gradle'
apply from: 'gradle/furniture-catalog.gradle'
apply from: 'gradle/locales.gradle'

tasks.named('check') {
    dependsOn tasks.named('verifyPinnedCoreArtifact')
    dependsOn tasks.named('verifyMavenCoordinates')
    dependsOn tasks.named('verifyFurnitureInventory')
    dependsOn tasks.named('verifyResourceJson')
    dependsOn tasks.named('verifyBlockstateModelReferences')
    dependsOn tasks.named('verifyIntegrationTextures')
    dependsOn tasks.named('verifyNamespaceMigration')
    dependsOn tasks.named('verifyLegacyMigrationContract')
    dependsOn tasks.named('verifyLegacyMigrationFixtures')
    dependsOn tasks.named('verifyExpandedMetadata')
    dependsOn tasks.named('verifyRepositoryHygiene')
    dependsOn tasks.named('verifyWorkflowActionPins')
    dependsOn tasks.named('verifyReleaseTagWorkflow')
    dependsOn tasks.named('verifyReleaseConfiguration')
}
