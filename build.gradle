def archiveTextSuffixes = ['.cfg', '.html', '.java', '.json', '.lang', '.mcmeta', '.md', '.properties', '.txt', '.xml', '.toml']
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    def properties = [
            version: project.version,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_authors: project.mod_authors,
            mod_description: project.mod_description,
            minecraft_version_range: project.minecraft_version_range,
            forge_version_range: project.forge_version_range,
            loader_version_range: project.loader_version_range,
            ironagefurniture_version_range: project.ironagefurniture_version_range,
            biomesoplenty_version_range: project.biomesoplenty_version_range
    ]
    inputs.properties properties
    filesMatching(['META-INF/mods.toml']) { expand properties }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    from('README.md') { into 'META-INF/iafbopaddon/docs' }
    from('CHANGELOG.md') { into 'META-INF/iafbopaddon/docs' }
    from('docs/VERSIONS.md') { into 'META-INF/iafbopaddon/docs' }
}

