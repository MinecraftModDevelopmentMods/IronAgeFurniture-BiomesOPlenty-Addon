tasks.register('verifyBlockstateModelReferences') {
    group = 'verification'
    dependsOn tasks.named('verifyPinnedCoreArtifact')
    inputs.dir layout.projectDirectory.dir('src/main/resources/assets/ironagefurniture/blockstates')
    inputs.dir layout.projectDirectory.dir('src/main/resources/assets/ironagefurniture/models/block')
    inputs.files configurations.ironAgeFurnitureVerification
    doLast {
        Set<String> availableModels = fileTree('src/main/resources/assets/ironagefurniture/models/block') {
            include '*.json'
        }.files.collect { model ->
            "ironagefurniture:block/${model.name.replaceFirst(/\.json$/, '')}".toString()
        } as Set<String>
        new ZipFile(configurations.ironAgeFurnitureVerification.singleFile).withCloseable { coreJar ->
            coreJar.entries().findAll {
                it.name.startsWith('assets/ironagefurniture/models/block/') && it.name.endsWith('.json')
            }.each { entry ->
                String model = entry.name
                        .replaceFirst('assets/ironagefurniture/models/block/', 'ironagefurniture:block/')
                        .replaceFirst(/\.json$/, '')
                availableModels.add(model.toString())
            }
        }

        Set<String> missing = new TreeSet<>()
        Closure collectModels
        collectModels = { value, File source ->
            if (value instanceof Map) {
                if (value.model instanceof String
                        && value.model.startsWith('ironagefurniture:block/')
                        && !availableModels.contains(value.model)) {
                    missing.add("${project.relativePath(source)} -> ${value.model}")
                }
                value.values().each { nested -> collectModels(nested, source) }
            } else if (value instanceof Collection) {
                value.each { nested -> collectModels(nested, source) }
            }
        }
        fileTree('src/main/resources/assets/ironagefurniture/blockstates') { include '*.json' }.each { blockstate ->
            collectModels(new JsonSlurper().parse(blockstate), blockstate)
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Blockstates reference missing models: ${missing.take(20)}")
        }
    }
}

tasks.register('verifyIntegrationTextures') {
