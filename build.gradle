    if (['runClient', 'runServer', 'runGameTestServer'].contains(runTask.name)) {
        def mergedOutput = runTask.name == 'runGameTestServer'
                ? gameTestModOutput : developmentModOutput
        runTask.dependsOn(runTask.name == 'runGameTestServer'
                ? prepareGameTestMod : prepareDevelopmentMod)
        runTask.doFirst {
            Set<String> splitOutputs = (sourceSets.main.output.files
                    + (runTask.name == 'runGameTestServer' ? sourceSets.gameTest.output.files : []))
                    .collect {
                it.canonicalFile.absolutePath
            } as Set
            Collection<File> targetClasspath = runTask.classpath.files.findAll {
                !splitOutputs.contains(it.canonicalFile.absolutePath)
            }
            runTask.classpath = files(mergedOutput, targetClasspath)
            runTask.environment 'MOD_CLASSES', "${project.mod_id}%%${mergedOutput.get().asFile}"
            File modsDirectory = new File(runTask.workingDir, 'mods')
            if (!modsDirectory.isDirectory() && !modsDirectory.mkdirs()) {
                throw new GradleException("Could not create development mods directory: ${modsDirectory}")
            }
        }
