def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}
def minecraftParts = project.minecraft_version.toString().tokenize('.')
def patch = minecraftParts.size() == 3 ? minecraftParts[2] : '0'
def expectedTarget = "${minecraftParts[0]}${minecraftParts[1].padLeft(2, '0')}${patch.padLeft(2, '0')}${project.loader_code}"
if (versionParts[3] != expectedTarget) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match ${project.minecraft_version} ${project.loader_name} target ${expectedTarget}")
}
if (GradleVersion.current() != GradleVersion.version('9.2.1')) {
    throw new GradleException("This build requires Gradle 9.2.1, found ${GradleVersion.current()}")
}
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
    throw new GradleException("Gradle requires Java 25 or newer, found ${System.getProperty('java.version')}")
}

def sha256Of = { File inputFile ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    inputFile.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString().toLowerCase(Locale.ROOT)
}

def java25Compiler = javaToolchains.compilerFor {
    languageVersion = JavaLanguageVersion.of(25)
    vendor = JvmVendorSpec.ADOPTIUM
}
def java25Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
    vendor = JvmVendorSpec.ADOPTIUM
}

