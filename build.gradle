tasks.register('verifyRepositoryHygiene') {
    group = 'verification'
    doLast {
        List<String> forbidden = ['.gradle/', 'build/', 'bin/', 'run/', '.idea/', '*.launch']
        List<String> tracked = providers.exec {
            commandLine 'git', 'ls-files'
        }.standardOutput.asText.get().readLines()
        List<String> bad = tracked.findAll { path ->
            path.startsWith('.gradle/') || path.startsWith('build/') || path.startsWith('bin/')
                    || path.startsWith('run/') || path.startsWith('.idea/') || path.endsWith('.launch')
        }
        if (!bad.isEmpty()) throw new GradleException("Generated files are tracked: ${bad}")
        fileTree(project.projectDir) {
            include '**/*'
            exclude '.git/**', '.gradle/**', 'build/**', 'bin/**', 'logs/**', 'run/**', 'run-*/**'
        }.files.each { candidate ->
            if (candidate.isFile() && candidate.length() < 2_000_000L) {
                String text
                try { text = candidate.getText('UTF-8') } catch (Exception ignored) { return }
                if (text.contains('D:\\IronAgeFurniture') || text.contains('C:\\Users\\johnb')) {
                    throw new GradleException("Machine-specific path in ${project.relativePath(candidate)}")
                }
            }
        }
    }
}

tasks.register('verifyWorkflowActionPins') {
    group = 'verification'
    doLast {
        File workflows = file('.github/workflows')
        if (!workflows.isDirectory()) throw new GradleException('Missing GitHub workflows')
        fileTree(workflows) { include '*.yml'; include '*.yaml' }.each { workflow ->
            workflow.readLines('UTF-8').eachWithIndex { line, index ->
                def match = line =~ /^\s*uses:\s*([^#\s]+).*/
                if (match.matches()) {
                    String action = match.group(1)
                    if (!action.startsWith('./') && !(action ==~ /[^@]+@[0-9a-f]{40}/)) {
                        throw new GradleException("Unpinned action ${action} at ${workflow}:${index + 1}")
                    }
                }
            }
        }
    }
}

tasks.register('verifyReleaseTagWorkflow') {
    group = 'verification'
    doLast {
        String workflow = file('.github/workflows/release.yml').getText('UTF-8')
        if (!workflow.contains('curseforge_project_id') || !workflow.contains('UNASSIGNED')) {
            throw new GradleException('Release workflow does not fail closed while CurseForge ID is unassigned')
        }
    }
}

tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    doLast {
        if (project.curseforge_project_id.toString() != 'UNASSIGNED') {
            if (!(project.curseforge_project_id.toString() ==~ /\d+/)) throw new GradleException('CurseForge project ID must be numeric')
        }
        ['README.md', 'CHANGELOG.md', 'docs/VERSIONS.md'].each { path ->
            if (!file(path).getText('UTF-8').contains(project.version.toString())) {
                throw new GradleException("${path} does not document ${project.version}")
            }
        }
    }
}

tasks.register('validateCurseForgeProjectId') {
    group = 'publishing'
    doLast {
        if (!(project.curseforge_project_id.toString() ==~ /\d+/)) {
            throw new GradleException('CurseForge publication is disabled until curseforge_project_id is assigned')
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    dependsOn tasks.named('assemble'), tasks.named('verifyExpandedMetadata'), tasks.named('verifyFurnitureCatalog'), tasks.named('verifyFurnitureInventory')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<File> jars = (libs.listFiles() ?: [] as File[]).findAll { it.name.endsWith('.jar') }.sort { it.name }
        if (jars.collect { it.name } != expectedReleaseFiles.sort()) {
            throw new GradleException("Expected exactly ${expectedReleaseFiles}, found ${jars.collect { it.name }}")
        }
        File mainJar = new File(libs, "${base.archivesName.get()}-${project.version}.jar")
        new ZipFile(mainJar).withCloseable { zip ->
            ['META-INF/neoforge.mods.toml', 'zone/moddev/mc/iafbopaddon/IAFBiomesOPlentyAddon.class'].each {
                if (zip.getEntry(it) == null) throw new GradleException("Release jar is missing ${it}")
            }
            if (zip.entries().any { it.name.startsWith('biomesoplenty/') || it.name.startsWith('assets/biomesoplenty/') }) {
                throw new GradleException('Release jar redistributes Biomes O Plenty content')
            }
            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = zip.getInputStream(entry).withCloseable { it.readNBytes(8) }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 69) throw new GradleException("${entry.name} uses class major ${major}; expected 69")
            }
            Manifest manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            if (manifest.mainAttributes.getValue('Maven-Artifact') != expectedCoordinate) {
                throw new GradleException('Release manifest has the wrong Maven coordinate')
            }
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseArtifacts')
    inputs.files(expectedReleaseFiles.collect { layout.buildDirectory.file("libs/${it}") })
    outputs.file layout.buildDirectory.file('release/SHA256SUMS')
    doLast {
        File output = layout.buildDirectory.file('release/SHA256SUMS').get().asFile
        output.parentFile.mkdirs()
        File libs = layout.buildDirectory.dir('libs').get().asFile
        output.setText(expectedReleaseFiles.sort().collect { "${sha256Of(new File(libs, it))}  ${it}" }.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('verifyReleaseChecksums') {
    group = 'verification'
    dependsOn tasks.named('writeReleaseChecksums')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        layout.buildDirectory.file('release/SHA256SUMS').get().asFile.readLines('UTF-8').each { line ->
            def parts = line.split(/\s+/, 2)
            if (sha256Of(new File(libs, parts[1])) != parts[0]) throw new GradleException("Checksum mismatch for ${parts[1]}")
        }
    }
}

def prepareEclipseResources = tasks.register('prepareEclipseResources', Sync) {
    dependsOn tasks.named('processResources')
    from layout.buildDirectory.dir('resources/main')
    into layout.projectDirectory.dir('bin/main')
}
eclipse.synchronizationTasks 'prepareEclipseResources'
tasks.named('eclipse').configure {
    dependsOn prepareEclipseResources
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        preferences.setProperty('eclipse.preferences.version', '1')
        preferences.setProperty('connection.gradle.distribution', 'GRADLE_DISTRIBUTION(WRAPPER)')
        preferences.setProperty('override.workspace.settings', 'true')
        preferences.setProperty('gradle.user.home', gradle.gradleUserHomeDir.canonicalPath)
        preferences.setProperty('connection.gradle.user.home', gradle.gradleUserHomeDir.canonicalPath)
        preferences.setProperty('java.home', java25Launcher.get().metadata.installationPath.asFile.canonicalPath)
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream { preferences.store(it, 'Generated by IAF BOP Add-on for Buildship.') }
    }
}
tasks.register('prepareEclipse') { dependsOn tasks.named('eclipse') }
tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn tasks.named('eclipse')
    doLast {
        File classpath = file('.classpath')
        File projectFile = file('.project')
        if (!classpath.isFile() || !projectFile.getText('UTF-8').contains("<name>${eclipseWorkspaceProjectName}</name>")) {
            throw new GradleException('Eclipse project metadata is missing or misnamed')
        }
        def xml = new XmlSlurper(false, false).parse(classpath)
        List<String> libraries = xml.classpathentry.findAll { it.@kind.text() == 'lib' }
                .collect { it.@path.text().replace('\\', '/').toLowerCase(Locale.ROOT) }
        Set<String> duplicates = libraries.findAll { path -> libraries.count { it == path } > 1 } as Set<String>
        if (!duplicates.isEmpty()) throw new GradleException("Duplicate Eclipse libraries: ${duplicates}")
        String text = classpath.getText('UTF-8')
        if (!text.contains('path="build/resources/main"') || text.contains('path="src/main/resources"')) {
            throw new GradleException('Eclipse must use processed production resources in bin/main')
        }
    }
}

tasks.register('validateMavenReleaseCredentials') {
    group = 'publishing'
    dependsOn tasks.named('validateCurseForgeProjectId')
    doLast {
        ['MAVEN_UPLOAD_URL', 'MAVEN_UPLOAD_USERNAME', 'MAVEN_UPLOAD_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("${it} is required")
        }
    }
}
tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('validateMavenReleaseCredentials'), tasks.named('verifyReleaseArtifacts')
}

tasks.named('check') {
    dependsOn tasks.named('verifyPinnedCoreArtifact')
    dependsOn tasks.named('verifyMavenCoordinates')
    dependsOn tasks.named('verifyFurnitureInventory')
    dependsOn tasks.named('verifyResourceJson')
    dependsOn tasks.named('verifyBlockstateModelReferences')
    dependsOn tasks.named('verifyIntegrationTextures')
    dependsOn tasks.named('verifyNamespaceMigration')
    dependsOn tasks.named('verifyLegacyMigrationContract')
    dependsOn tasks.named('verifyLegacyMigrationFixtures')
    dependsOn tasks.named('verifyExpandedMetadata')
    dependsOn tasks.named('verifyRepositoryHygiene')
    dependsOn tasks.named('verifyWorkflowActionPins')
    dependsOn tasks.named('verifyReleaseTagWorkflow')
    dependsOn tasks.named('verifyReleaseConfiguration')
}

