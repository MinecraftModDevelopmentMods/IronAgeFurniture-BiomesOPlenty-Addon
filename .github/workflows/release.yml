name: Publish IAF Biomes O Plenty Add-on release

run-name: Publish add-on ${{ inputs.release_version }} (CurseForge ${{ inputs.curseforge_release_level }})

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact four-part version from gradle.properties
        required: true
        type: string
      curseforge_release_level:
        description: CurseForge release level
        required: true
        default: release
        type: choice
        options: [release, beta, alpha]
      confirm_live_publication:
        description: Confirm Maven, CurseForge, and GitHub publication
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: iaf-bop-addon-release-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate immutable release candidate
    if: github.repository == 'MinecraftModDevelopmentMods/IronAgeFurniture-BiomesOPlenty-Addon'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
      artifact_name: ${{ steps.validate.outputs.artifact_name }}
      curseforge_project_id: ${{ steps.validate.outputs.curseforge_project_id }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master-26.3-neo
          fetch-depth: 0
      - name: Validate version, project identity, and exact-commit CI
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          value() { sed -n "s/^$1=//p" gradle.properties; }
          version="$(value mod_version)"
          curseforge_project_id="$(value curseforge_project_id)"
          if [[ "$version" != "${{ inputs.release_version }}" ]]; then
            echo "Requested version does not match gradle.properties: $version" >&2
            exit 1
          fi
          if [[ "$curseforge_project_id" == "UNASSIGNED" || ! "$curseforge_project_id" =~ ^[0-9]+$ ]]; then
            echo "Publication is disabled until curseforge_project_id replaces UNASSIGNED" >&2
            exit 1
          fi
          if [[ "$(value mod_id)" != "iafbopaddon" || "$(value loader_name)" != "neoforge" ]]; then
            echo "Unexpected add-on identity" >&2
            exit 1
          fi
          release_sha="$(git rev-parse HEAD)"
          success="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "Build, test, and audit" and .conclusion == "success")] | length')"
          if [[ "$success" -lt 1 ]]; then
            echo "The exact release commit has no green Build, test, and audit check" >&2
            exit 1
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=iaf-bop-addon-$version-$release_sha" >> "$GITHUB_OUTPUT"
          echo "curseforge_project_id=$curseforge_project_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build immutable three-jar bundle
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
      - name: Install exact Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build and verify candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean check build javadoc verifyReleaseArtifacts writeReleaseChecksums verifyReleaseChecksums \
            --no-daemon --stacktrace \
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false
          mkdir release-candidate
          cp build/libs/*.jar build/release/SHA256SUMS CHANGELOG.md release-candidate/
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          path: release-candidate/*

  approve:
    name: Confirm protected live publication
    needs: [preflight, build]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit live-publication confirmation
        env:
          CONFIRMED: ${{ inputs.confirm_live_publication }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MAVEN_UPLOAD_URL: ${{ secrets.MAVEN_UPLOAD_URL }}
          MAVEN_UPLOAD_USERNAME: ${{ secrets.MAVEN_UPLOAD_USERNAME }}
          MAVEN_UPLOAD_PASSWORD: ${{ secrets.MAVEN_UPLOAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMED" == "true" ]] || { echo 'Live publication was not confirmed' >&2; exit 1; }
          for name in CURSEFORGE_TOKEN MAVEN_UPLOAD_URL MAVEN_UPLOAD_USERNAME MAVEN_UPLOAD_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "$name is required" >&2; exit 1; }
          done
      - name: Create or verify exact release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION" --jq .object.sha 2>/dev/null || true)"
          if [[ -n "$existing" && "$existing" != "$RELEASE_SHA" ]]; then
            echo "Existing tag points to $existing rather than $RELEASE_SHA" >&2
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_VERSION" -f sha="$RELEASE_SHA"
          fi

  publish-maven:
    name: Publish Maven
    needs: [preflight, build, approve]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
      - name: Install exact Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Publish exact source commit to MMD Maven
        env:
          MAVEN_UPLOAD_URL: ${{ secrets.MAVEN_UPLOAD_URL }}
          MAVEN_UPLOAD_USERNAME: ${{ secrets.MAVEN_UPLOAD_USERNAME }}
          MAVEN_UPLOAD_PASSWORD: ${{ secrets.MAVEN_UPLOAD_PASSWORD }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew publishMavenJavaPublicationToMMDReleasesRepository \
            --no-daemon --stacktrace \
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

  publish-curseforge:
    name: Publish CurseForge
    needs: [preflight, build, publish-maven]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Download immutable release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: release-candidate
      - name: Verify candidate checksums
        shell: bash
        run: (cd release-candidate && sha256sum --check SHA256SUMS)
      - name: Publish add-on to CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: ${{ needs.preflight.outputs.curseforge_project_id }}
          curseforge-dependencies: |
            iron-age-furniture(required)
            biomes-o-plenty(required)
          files: release-candidate/iron-age-furniture-biomes-o-plenty-addon-${{ inputs.release_version }}.jar
          name: Iron Age Furniture Biomes O Plenty Add-on ${{ inputs.release_version }}
          version: ${{ inputs.release_version }}
          version-type: ${{ inputs.curseforge_release_level }}
          changelog-file: release-candidate/CHANGELOG.md
          loaders: neoforge
          game-versions: 26.3

  publish-github:
    name: Publish GitHub Release
    needs: [preflight, build, publish-curseforge]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Download immutable release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: release-candidate
      - name: Publish GitHub Release last
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          github-token: ${{ github.token }}
          github-tag: ${{ inputs.release_version }}
          files: release-candidate/*.jar
          name: Iron Age Furniture Biomes O Plenty Add-on ${{ inputs.release_version }}
          version: ${{ inputs.release_version }}
          changelog-file: release-candidate/CHANGELOG.md
