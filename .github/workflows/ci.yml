name: IAF Biomes O Plenty Add-on 26.3 NeoForge CI

on:
  push:
    branches:
      - master-26.3-neo
  pull_request:
    branches:
      - master-26.3-neo

permissions:
  contents: read

concurrency:
  group: iaf-bop-addon-26.3-neoforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-bootstrap:
    name: Cold and offline-repeat bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install exact Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Resolve once from an empty cache and repeat offline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          export GRADLE_USER_HOME="$RUNNER_TEMP/iaf-bop-addon-cold-cache"
          rm -rf "$GRADLE_USER_HOME"
          args=(
            --no-daemon --no-build-cache --stacktrace --max-workers=2
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew compileJava verifyPinnedCoreArtifact "${args[@]}"
          ./gradlew compileJava verifyPinnedCoreArtifact --offline "${args[@]}"

  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install exact Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Download the stable and newer BOP compatibility fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bop-compatibility"
          cd "$RUNNER_TEMP/bop-compatibility"
          curl --fail --location --retry 3 \
            'https://edge.forgecdn.net/files/8973/616/BiomesOPlenty-neoforge-26.3-26.3.0.0.7.jar' \
            --output BiomesOPlenty-neoforge-26.3-26.3.0.0.7.jar
          curl --fail --location --retry 3 \
            'https://edge.forgecdn.net/files/9168/503/BiomesOPlenty-neoforge-26.3-26.3.0.0.15.jar' \
            --output BiomesOPlenty-neoforge-26.3-26.3.0.0.15.jar
          printf '%s\n' \
            '091246a05f8f7c7d5f10f76686fcc7ee7c51cb52f063d02241d3500e64461660  BiomesOPlenty-neoforge-26.3-26.3.0.0.7.jar' \
            '350a8086eed80756aa59c8f618b00fc1f126a98bb9cda88452ff21e925bdc62a  BiomesOPlenty-neoforge-26.3-26.3.0.0.15.jar' \
            | sha256sum --check -
      - name: Build, test, document, and audit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          args=(
            --no-daemon --stacktrace --max-workers=2
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew clean "${args[@]}"
          ./gradlew check build javadoc verifyFurnitureCatalog verifyReleaseArtifacts \
            writeReleaseChecksums verifyReleaseChecksums prepareEclipse \
            verifyEclipseProductionClasspath \
            "-PbiomesOPlentyJar=$RUNNER_TEMP/bop-compatibility/BiomesOPlenty-neoforge-26.3-26.3.0.0.7.jar" "${args[@]}"
          ./gradlew verifyIntegrationTextures \
            "-PbiomesOPlentyJar=$RUNNER_TEMP/bop-compatibility/BiomesOPlenty-neoforge-26.3-26.3.0.0.15.jar" "${args[@]}"
      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iaf-bop-addon-26.3-neoforge-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/iron-age-furniture-biomes-o-plenty-addon-*.jar
            build/release/SHA256SUMS
            CHANGELOG.md
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iaf-bop-addon-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            run/logs/**
