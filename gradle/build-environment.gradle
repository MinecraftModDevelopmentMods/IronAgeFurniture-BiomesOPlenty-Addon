[mavenizerCompatibilityJar.asFile, mavenizerRuleManifest.asFile].each { fixture ->
    if (!fixture.isFile()) throw new GradleException("Missing Mavenizer compatibility fixture: ${fixture}")
    String actual = sha256Of(fixture).toUpperCase(Locale.ROOT)
    String expected = mavenizerFixtureChecksums[fixture]
    if (actual != expected) {
        throw new GradleException("Mavenizer compatibility fixture checksum mismatch for ${fixture.name}: expected ${expected}, found ${actual}")
    }
}

