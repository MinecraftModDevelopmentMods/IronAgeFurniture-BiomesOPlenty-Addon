eclipse {
    project {
        name = eclipseWorkspaceProjectName
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
        natures 'org.eclipse.buildship.core.gradleprojectnature'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
        defaultOutputDir = file('bin/default')
        file.whenMerged { classpath ->
            classpath.entries.findAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.Output
            }.each { entry -> entry.path = 'bin/default' }
            String resourcesPath = processedMainResourcesPath()
            Set<String> replacedResourcePaths = [
                    'src/main/resources',
                    'src/generated/resources',
                    'build/resources/main'
            ] as Set
            classpath.entries.removeAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
                        && entry.path != resourcesPath
                        && replacedResourcePaths.contains(entry.path)
            }
            Set<String> libraryPaths = new LinkedHashSet<>()
            classpath.entries.removeAll { entry ->
                if (!(entry instanceof org.gradle.plugins.ide.eclipse.model.Library)) return false
                !libraryPaths.add(entry.path.replace('\\', '/').toLowerCase(Locale.ROOT))
            }
            if (!classpath.entries.any { it.path == resourcesPath }) {
                classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.SourceFolder(resourcesPath, 'bin/main'))
            }
            classpath.entries.findAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
            }.each { entry ->
                if (entry.path == 'src/main/java' || entry.path == resourcesPath) entry.output = 'bin/main'
                else if (entry.path.startsWith('src/test/')) entry.output = 'bin/test'
                else if (entry.path.startsWith('src/gameTest/')) entry.output = 'bin/gameTest'
            }
        }
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
}
