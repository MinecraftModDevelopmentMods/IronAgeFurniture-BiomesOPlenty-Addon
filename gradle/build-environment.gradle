tasks.register('verifyPinnedCoreArtifact') {
    group = 'verification'
    inputs.files configurations.ironAgeFurnitureVerification
    doLast {
        Set<File> files = configurations.ironAgeFurnitureVerification.files
        if (files.size() != 1) throw new GradleException("Expected one released IronAgeFurniture jar, found ${files}")
        String actual = sha256Of(files.first())
        String expected = localCoreJarSetting.isPresent()
                ? localCoreHashSetting.get() : project.ironagefurniture_sha256.toString()
        if (!actual.equalsIgnoreCase(expected)) {
            throw new GradleException("IronAgeFurniture ${project.ironagefurniture_version} SHA-256 mismatch: ${actual}")
        }
    }
}
tasks.named('compileJava') { dependsOn tasks.named('verifyPinnedCoreArtifact') }

ext.downloadDevelopmentRuntimeMods = tasks.register('downloadDevelopmentRuntimeMods') {
    group = 'ide'
    description = 'Downloads the exact BOP development runtime jars into the ignored Gradle cache.'
    outputs.files developmentRuntimeCacheFiles
    outputs.upToDateWhen {
        developmentRuntimeDefinitions.every { runtimeMod ->
            File cached = new File(developmentRuntimeCacheDirectory, runtimeMod.file)
            cached.isFile() && sha256Of(cached) == runtimeMod.sha256.toLowerCase(Locale.ROOT)
        }
    }
    doLast {
        if (!developmentRuntimeCacheDirectory.isDirectory()
                && !developmentRuntimeCacheDirectory.mkdirs()) {
            throw new GradleException(
                    "Could not create development runtime cache: ${developmentRuntimeCacheDirectory}")
        }
        developmentRuntimeDefinitions.each { runtimeMod ->
            File cached = new File(developmentRuntimeCacheDirectory, runtimeMod.file)
            String expectedHash = runtimeMod.sha256.toLowerCase(Locale.ROOT)
            if (cached.isFile() && sha256Of(cached) == expectedHash) return
            if (gradle.startParameter.offline) {
                throw new GradleException(
                        "Offline mode cannot download required development runtime jar ${runtimeMod.file}")
            }

            File partial = new File(developmentRuntimeCacheDirectory, "${runtimeMod.file}.part")
            try {
                URLConnection connection = URI.create(runtimeMod.url).toURL().openConnection()
                connection.connectTimeout = 30_000
                connection.readTimeout = 120_000
                connection.setRequestProperty('User-Agent', 'IronAgeFurniture-BOP-Addon-Development')
                connection.inputStream.withCloseable { input ->
                    Files.copy(input, partial.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }
                String actualHash = sha256Of(partial)
                if (actualHash != expectedHash) {
                    throw new GradleException(
                            "Development runtime checksum mismatch for ${runtimeMod.file}: ${actualHash}")
                }
                Files.move(partial.toPath(), cached.toPath(), StandardCopyOption.REPLACE_EXISTING)
            } finally {
                if (partial.isFile()) partial.delete()
            }
        }
    }
}
ext.verifyDevelopmentRuntimeMods = tasks.register('verifyDevelopmentRuntimeMods') {
    group = 'verification'
    description = 'Verifies the pinned Forge BOP development runtime.'
    dependsOn downloadDevelopmentRuntimeMods
    inputs.files developmentRuntimeCacheFiles
    doLast {
        developmentRuntimeDefinitions.each { runtimeMod ->
            File cached = new File(developmentRuntimeCacheDirectory, runtimeMod.file)
            String actualHash = cached.isFile() ? sha256Of(cached) : 'missing'
            if (actualHash != runtimeMod.sha256.toLowerCase(Locale.ROOT)) {
                throw new GradleException("Development runtime checksum mismatch for ${runtimeMod.file}: ${actualHash}")
            }
        }
    }
}
ext.prepareDevelopmentRuntimeMods = tasks.register('prepareDevelopmentRuntimeMods') {
    group = 'ide'
    description = 'Copies the pinned BOP, GlitchCore and TerraBlender jars into the development mods folder.'
    dependsOn verifyDevelopmentRuntimeMods
    inputs.files developmentRuntimeCacheFiles
    File modsDirectory = layout.projectDirectory.dir(
            "${providers.gradleProperty('runDirectory').getOrElse('run')}/mods").asFile
    outputs.files developmentRuntimeDefinitions.collect { new File(modsDirectory, it.file) }
    doLast {
        if (!modsDirectory.isDirectory() && !modsDirectory.mkdirs()) {
            throw new GradleException("Could not create development mods directory: ${modsDirectory}")
        }
        developmentRuntimeDefinitions.each { runtimeMod ->
            File target = new File(modsDirectory, runtimeMod.file)
            File cached = new File(developmentRuntimeCacheDirectory, runtimeMod.file)
            Files.copy(cached.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
            if (sha256Of(target) != runtimeMod.sha256.toLowerCase(Locale.ROOT)) {
                throw new GradleException("Staged development runtime checksum mismatch for ${target.name}")
            }
        }
    }
}
ext.prepareGameTestRuntimeMods = tasks.register('prepareGameTestRuntimeMods') {
    group = 'verification'
    description = 'Copies the pinned BOP, GlitchCore and TerraBlender jars into the GameTest server.'
    dependsOn verifyDevelopmentRuntimeMods
    inputs.files developmentRuntimeCacheFiles
    File modsDirectory = layout.projectDirectory.dir(
            "${providers.gradleProperty('gameTestRunDirectory').getOrElse('build/game-test-run')}/mods").asFile
    outputs.files developmentRuntimeDefinitions.collect { new File(modsDirectory, it.file) }
    doLast {
        if (!modsDirectory.isDirectory() && !modsDirectory.mkdirs()) {
            throw new GradleException("Could not create GameTest mods directory: ${modsDirectory}")
        }
        developmentRuntimeDefinitions.each { runtimeMod ->
            File target = new File(modsDirectory, runtimeMod.file)
            File cached = new File(developmentRuntimeCacheDirectory, runtimeMod.file)
            Files.copy(cached.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
            if (sha256Of(target) != runtimeMod.sha256.toLowerCase(Locale.ROOT)) {
                throw new GradleException("Staged GameTest runtime checksum mismatch for ${target.name}")
            }
        }
    }
}
tasks.withType(JavaExec).configureEach { JavaExec runTask ->
    if (['runClient', 'runServer'].contains(runTask.name)) {
        runTask.dependsOn prepareDevelopmentRuntimeMods
    } else if (runTask.name == 'runGameTestServer') {
        runTask.dependsOn prepareGameTestRuntimeMods
    }
}
