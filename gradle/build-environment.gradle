    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    if (localCoreJarSetting.isPresent()) {
        File stagedCore = file(localCoreJarSetting.get())
        String expectedHash = localCoreHashSetting.getOrElse('')
        if (!stagedCore.isFile() || stagedCore.canonicalFile.toPath().startsWith(projectDir.canonicalFile.toPath())
                || stagedCore.name != "iron-age-furniture-${project.ironagefurniture_version}.jar"
                || !(expectedHash ==~ /(?i)[0-9a-f]{64}/) || !sha256Of(stagedCore).equalsIgnoreCase(expectedHash))
            throw new GradleException('Local testing requires an external, checksum-verified jar of the exact pinned core version')
        implementation files(stagedCore)
        ironAgeFurnitureVerification files(stagedCore)
    } else {
        implementation("zone.moddev.mc:iron-age-furniture:${project.ironagefurniture_version}") { transitive = false }
        ironAgeFurnitureVerification("zone.moddev.mc:iron-age-furniture:${project.ironagefurniture_version}") { transitive = false }
