tasks.register('verifyShieldChairItems') {
    group = 'verification'
    description = 'Keeps empty BOP shield-chair items on their bare wooden frame models.'
    doLast {
        // The add-on keeps its historical furniture/resource namespace for old saves.
        Set<File> chairs = fileTree('src/main/resources/assets/ironagefurniture/items') { include 'chair_wood_ironage_shield_*.json' }.files
        if (chairs.size() != 14) throw new GradleException('Expected all fourteen BOP shield-chair item definitions')
        chairs.each { source ->
            String id = source.name[0..-6]
            Map model = new JsonSlurper().parse(source).model
            if (model.type != 'minecraft:condition' || model.property != 'minecraft:component'
                    || model.predicate != 'minecraft:container' || model.value?.items?.size != 0
                    || model.on_true?.model != "ironagefurniture:block/${id}_frame"
                    || model.on_false?.model != "ironagefurniture:item/${id}")
                throw new GradleException("Empty shield storage does not select the BOP frame model: ${id}")
        }
    }
}
tasks.named('check') { dependsOn 'verifyShieldChairItems' }

