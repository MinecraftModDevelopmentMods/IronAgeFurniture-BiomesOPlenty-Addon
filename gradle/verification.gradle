tasks.register('verifyMavenizerCompatibilityFixture') {
    group = 'verification'
    description = 'Verifies the sealed Forge 66 Mavenizer compatibility tool.'
    inputs.files mavenizerFixtureChecksums.keySet()
    doLast {
        mavenizerFixtureChecksums.each { fixture, expected ->
            if (!fixture.isFile() || sha256Of(fixture) != expected.toLowerCase(Locale.ROOT)) {
                throw new GradleException("Mavenizer fixture is missing or changed: ${fixture}")
            }
        }
        def parsed = new JsonSlurper().parse(mavenizerRuleManifest.asFile)
        if (parsed.schema != 1 || parsed.targets.keySet() !=
                ['net.minecraftforge:forge:26.3-66.0.2'] as Set) {
            throw new GradleException('Mavenizer target-rule manifest has unexpected targets or schema')
        }
        def rules = parsed.targets['net.minecraftforge:forge:26.3-66.0.2']
        if (rules.expectedApplications != 0 || !rules.rules.isEmpty()) {
            throw new GradleException('Forge 66 Mavenizer target must be an explicit zero-rule qualification')
        }
        new ZipFile(mavenizerCompatibilityJar.asFile).withCloseable { ZipFile zip ->
            def embeddedEntry = zip.getEntry('META-INF/orespawn/minecraft-source-compatibility.json')
            if (embeddedEntry == null) {
                throw new GradleException('Mavenizer fixture is missing its embedded target-rule manifest')
            }
            byte[] embedded = zip.getInputStream(embeddedEntry).withCloseable { it.readAllBytes() }
            if (!Arrays.equals(embedded, mavenizerRuleManifest.asFile.bytes)) {
                throw new GradleException('Embedded and externally audited Mavenizer manifests differ')
            }
            def patcherEntry = zip.getEntry(
                    'net/minecraftforge/mcmaven/impl/util/SourceCompatibilityPatcher.class')
            byte[] classHeader = zip.getInputStream(patcherEntry).withCloseable { it.readNBytes(8) }
            int classMajor = ((classHeader[6] & 0xff) << 8) | (classHeader[7] & 0xff)
            if (classMajor != 69) {
                throw new GradleException("Mavenizer compatibility tool must use Java 25 bytecode, found ${classMajor}")
            }
        }
    }
}

tasks.register('verifyFurnitureInventory') {
    group = 'verification'
    doLast {
        File source = file('src/main/java/zone/moddev/mc/iafbopaddon/init/ModBOPBlocks.java')
        String javaText = source.getText('UTF-8')
        int registrations = (javaText =~ /public static RegistryObject<Block> chair_/).count
        if (registrations != 546) throw new GradleException("Expected 546 BOP registrations, found ${registrations}")
        Set<String> ids = (javaText =~ /register\("([^"]+)"/) .collect { it[1] } as Set<String>
        if (ids.size() != 546 || !ids.every { it.contains('_biomesoplenty_') }) {
            throw new GradleException('BOP registration IDs are incomplete or escaped the historical naming convention')
        }
        Map<String, Integer> expected = [
                // The 546 visible blockstates plus 30 non-cherry legacy BOP
                // compatibility blockstates whose names contain biomesoplenty.
                'assets/ironagefurniture/blockstates': 674,
                'assets/ironagefurniture/models/item': 1890,
                'assets/ironagefurniture/items': 1890,
                'data/ironagefurniture/recipe': 1890,
                'data/ironagefurniture/advancement/recipes/chairs': 546
        ]
        expected.each { relative, count ->
            File directory = file("src/main/resources/${relative}")
            Set<File> files = fileTree(directory) { include '*.json' }.files.findAll { it.name.contains('biomesoplenty') }
            if (files.size() != count) throw new GradleException("${relative} contains ${files.size()} BOP files; expected ${count}")
        }
        ['en_en.json', 'en_gb.json', 'en_us.json'].each { locale ->
            Map language = new JsonSlurper().parse(file("src/main/resources/assets/ironagefurniture/lang/${locale}")) as Map
            // Include the hidden canopy parts and legacy compatibility benches.
            if (language.size() != 3410) throw new GradleException("${locale} contains ${language.size()} translations; expected 3410")
        }
        List<String> woods = ['dead', 'fir', 'hellbark', 'jacaranda', 'magic', 'mahogany', 'maple',
                'origin_oak', 'palm', 'pine', 'redwood', 'umbran', 'willow', 'empyreal']
        List<String> colours = ['red', 'orange', 'magenta', 'light_blue', 'yellow', 'lime', 'pink', 'gray',
                'light_gray', 'cyan', 'purple', 'blue', 'brown', 'green', 'white', 'black']
        List<String> forms = ['chair_wood_ironage_wingback_', 'chair_wood_ironage_throne_',
                'bed_wood_foot_', 'bed_wood_foot_left_', 'bed_canopy_foot_lower_', 'bed_canopy_foot_left_lower_']
        woods.each { wood -> forms.each { form -> colours.each { colour ->
            String id = "${form}biomesoplenty_${wood}" + (colour == 'red' ? '' : "_${colour}")
            boolean namedRed = form.startsWith('chair_') || form == 'bed_canopy_foot_lower_'
            String recipeId = "${form}biomesoplenty_${wood}" + (colour == 'red' && !namedRed ? '' : "_${colour}")
            ['assets/ironagefurniture/items', 'assets/ironagefurniture/models/item'].each { directory ->
                if (!file("src/main/resources/${directory}/${id}.json").isFile())
                    throw new GradleException("Missing Phase 4 ${directory}/${id}.json")
            }
            ['data/ironagefurniture/recipe', 'data/ironagefurniture/advancement/recipes/phase_four'].each { directory ->
                if (!file("src/main/resources/${directory}/${recipeId}.json").isFile())
                    throw new GradleException("Missing Phase 4 ${directory}/${recipeId}.json")
            }
            Map recipe = new JsonSlurper().parse(file("src/main/resources/data/ironagefurniture/recipe/${recipeId}.json")) as Map
            if (recipe.result?.id != "ironagefurniture:${id}" || recipe.group != "ironagefurniture:${recipeId}")
                throw new GradleException("Incorrect recipe output or recipe-book group for ${id}")
        } } }
    }
}

