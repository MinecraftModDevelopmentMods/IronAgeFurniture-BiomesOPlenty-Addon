tasks.register('verifyReleaseRoutes') {
    group = 'verification'
    doLast {
        def route = { String releaseVersion ->
            String suffix = releaseVersion.tokenize('.').last()
            switch (suffix) {
                case '2603001': return 'master-26.3'
                case '2603002': return 'master-26.3-neo'
                default: throw new GradleException("Unsupported add-on release target ${suffix}")
            }
        }
        if (route('0.3.0.2603001') != 'master-26.3') {
            throw new GradleException('Forge release route did not resolve to master-26.3')
        }
        if (route('0.3.0.2603002') != 'master-26.3-neo') {
            throw new GradleException('NeoForge release route did not resolve to master-26.3-neo')
        }
        try {
            route('0.3.0.2603003')
            throw new GradleException('Unknown loader suffix did not fail closed')
        } catch (GradleException expected) {
            if (!expected.message.startsWith('Unsupported add-on release target')) throw expected
        }
    }
}

