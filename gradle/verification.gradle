}

tasks.register('verifyLegacyMigrationContract') {
    group = 'verification'
    doLast {
        String registry = file('src/main/java/zone/moddev/mc/iafbopaddon/compat/LegacyPaddedBenchRegistry.java').getText('UTF-8')
        String mappings = file('src/main/java/zone/moddev/mc/iafbopaddon/compat/LegacyPaddedBenchMappings.java').getText('UTF-8')
        String migration = file('src/main/java/zone/moddev/mc/iafbopaddon/compat/LegacyPaddedBenchMigration.java').getText('UTF-8')
        Map catalog = new JsonSlurper().parse(file('gradle/furniture-catalog.json')) as Map
        [
                'padded_bench_colour', 'registerIntermediateCherryItemAlias',
                'LegacyPaddedBenchBlockEntity::new'
        ].each { if (!registry.contains(it)) throw new GradleException("Legacy registry contract is missing ${it}") }
        ['"ebony", new TargetWood("hellbark", true)',
         '"ethereal", new TargetWood("warped", false)',
         '"eucalyptus", new TargetWood("origin_oak", true)',
         '"mangrove", new TargetWood("pale_oak", false)',
         '"sacred_oak", new TargetWood("origin_oak", true)'].each {
            if (!mappings.contains(it)) throw new GradleException("Legacy visual fallback is missing ${it}")
        }
        ['ChunkDataEvent.Load', 'PlayerLoggedInEvent', 'ItemEntity', 'DataComponents.CONTAINER',
         'DataComponents.BUNDLE_CONTENTS', 'transmuteCopy', 'removeColor'].each {
            if (!migration.contains(it)) throw new GradleException("Migration surface is missing ${it}")
        }
        Map<String, String> expectedFallbacks = [
                cherry: 'cherry', ebony: 'biomesoplenty_hellbark', ethereal: 'warped',
                eucalyptus: 'biomesoplenty_origin_oak', fir: 'biomesoplenty_fir',
                hellbark: 'biomesoplenty_hellbark', jacaranda: 'biomesoplenty_jacaranda',
                magic: 'biomesoplenty_magic', mahogany: 'biomesoplenty_mahogany',
                mangrove: 'pale_oak', palm: 'biomesoplenty_palm', pine: 'biomesoplenty_pine',
                redwood: 'biomesoplenty_redwood', sacred_oak: 'biomesoplenty_origin_oak',
                umbran: 'biomesoplenty_umbran', willow: 'biomesoplenty_willow'
        ]
        Map<String, String> catalogFallbacks = (catalog.legacyCompatibility as List).collectEntries {
            [(it.legacy.toString()): it.target.toString()]
        }
        if (catalogFallbacks != expectedFallbacks) {
            throw new GradleException("Legacy compatibility resources do not match migration fallbacks: ${catalogFallbacks}")
        }
    }
}

