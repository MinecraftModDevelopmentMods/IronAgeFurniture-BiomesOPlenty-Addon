// Publication uses one verified immutable bundle after explicit approval.
tasks.register('validateMavenReleaseCredentials') {
    group = 'publishing'
    dependsOn tasks.named('validateCurseForgeProjectId')
    doLast {
        if (localCoreJarSetting.isPresent())
            throw new GradleException('Publication requires the pinned released core, not local staging')
        ['MAVEN_UPLOAD_URL', 'MAVEN_UPLOAD_USERNAME', 'MAVEN_UPLOAD_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("${it} is required")
        }
        if (System.getenv('MAVEN_UPLOAD_URL').startsWith('file:')) {
            throw new GradleException('Maven release publication must use a remote repository')
        }
    }
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    description = 'Audits a previously built immutable release bundle before publication.'
    doLast {
        if (!preparedReleaseDir.isPresent()) {
            throw new GradleException('preparedReleaseDir is required')
        }
        File prepared = file(preparedReleaseDir.get())
        List<String> expectedBundle = (expectedReleaseFiles + ['SHA256SUMS', 'CHANGELOG.md']).sort()
        List<String> actualBundle = (prepared.listFiles() ?: [] as File[])
                .findAll { it.isFile() }.collect { it.name }.sort()
        if (actualBundle != expectedBundle) {
            throw new GradleException("Expected prepared bundle ${expectedBundle}, found ${actualBundle}")
        }
        Map<String, String> declared = new File(prepared, 'SHA256SUMS').readLines('UTF-8')
                .findAll { !it.trim().isEmpty() }.collectEntries { line ->
                    def parts = line.split(/\s+/, 2)
                    [(parts[1]): parts[0].toLowerCase(Locale.ROOT)]
                }
        if (declared.keySet().sort() != expectedReleaseFiles.sort()) {
            throw new GradleException('Prepared checksums do not list exactly the release jars')
        }
        declared.each { name, expected ->
            if (sha256Of(new File(prepared, name)) != expected) {
                throw new GradleException("Prepared checksum mismatch for ${name}")
            }
        }
    }
}
tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('validateMavenReleaseCredentials')
    dependsOn(preparedReleaseDir.isPresent()
            ? tasks.named('verifyPreparedReleaseArtifacts')
            : tasks.named('verifyReleaseArtifacts'))
}
